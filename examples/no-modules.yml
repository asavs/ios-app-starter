# The basic app with every module disabled: no package reference, no product dependency.
# The app sources import modules only under `#if canImport(...)`, so this must keep building.
include: ../project.yml

packages:REPLACE: {}

targets:
  StarterApp:
    dependencies:REPLACE: []
  # The widget extension draws the SessionActivity module's Live Activity; without the module it has
  # nothing to draw and the app no longer embeds it (the app's dependencies are replaced above).
  StarterWidgets:
    dependencies:REPLACE: []
