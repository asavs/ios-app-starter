# Demo identity used to validate this template against the registered Apple App ID.
# Keep the reusable template defaults in ../project.yml unchanged.
include: ../project.yml

settings:
  base:
    DEVELOPMENT_TEAM: 9L6Y9T3PPW

targets:
  StarterApp:
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "Starter App"
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo
  StarterAppTests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo.tests
  StarterAppUITests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo.uitests
