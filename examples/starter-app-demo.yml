# Demo identity used to validate this template against the registered Apple App ID.
# Keep the reusable template defaults in ../project.yml unchanged.
include: ../project.yml

# State the module library path here as well: XcodeGen rebases an included spec's package path
# relative to this file, which would point one directory too high. docs/modules.md explains.
packages:
  StarterModules:
    path: ..

settings:
  base:
    DEVELOPMENT_TEAM: 9L6Y9T3PPW

targets:
  StarterApp:
    # The demo shows every feature a builder could keep, the timer included: the template's essentials
    # plus SessionTimer, TimerRing, DurationPicker, SessionActivity and the widget extension that draws
    # the Live Activity. An overlay replaces the whole list, so the essentials are restated here.
    dependencies:REPLACE:
      - package: StarterModules
        product: TemplateVersion
      - package: StarterModules
        product: Theme
      - package: StarterModules
        product: Onboarding
      - package: StarterModules
        product: Settings
      - package: StarterModules
        product: TabShell
      - package: StarterModules
        product: Cues
      - package: StarterModules
        product: Database
      - package: StarterModules
        product: Attachments
      - package: StarterModules
        product: SessionTimer
      - package: StarterModules
        product: TimerRing
      - package: StarterModules
        product: DurationPicker
      - package: StarterModules
        product: SessionActivity
      - target: StarterWidgets
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "Starter App"
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo
  StarterAppTests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo.tests
  StarterAppUITests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo.uitests
  StarterWidgets:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asaschaeffer.starterappdemo.widgets
