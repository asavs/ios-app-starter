# Native XcodeGen include/override; not a second configuration format.
include: ../project.yml

# State the module library path here as well: XcodeGen rebases an included spec's package path
# relative to this file, which would point one directory too high. docs/modules.md explains.
packages:
  StarterModules:
    path: ..

targets:
  StarterApp:
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "Pocket Notes"
        DEV_DISPLAY_NAME: "Notes Dev"
        PRODUCT_BUNDLE_IDENTIFIER: org.example.pocketnotes
  StarterAppTests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.pocketnotes.tests
  StarterAppUITests:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.pocketnotes.uitests
