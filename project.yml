# Keep project, target, module, and scheme names stable; customize the app below.
name: StarterApp

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0" # App and tests inherit this minimum; initially supported: 17+.

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    # The app's link scheme: starterapp://settings opens the Settings tab. Lowercase letters, digits,
    # +, - and .; make it unique to the app, since iOS picks arbitrarily between apps sharing a scheme.
    APP_URL_SCHEME: starterapp

# The module library in this repository (Package.swift, Modules/<Name>/). The template depends on it
# by path; an app created from the template switches to `url:` + `from:` and a tag. docs/modules.md.
packages:
  StarterModules:
    path: .. # Relative to the generated project directory (StarterApp/), not to this file.

targets:
  StarterApp:
    type: application
    platform: iOS
    sources:
      - path: StarterApp/StarterApp
        excludes: [Info.plist] # Read through INFOPLIST_FILE, not copied as a resource.
    # Merged with the generated Info.plist: only what has no INFOPLIST_KEY_ build setting.
    info:
      path: StarterApp/StarterApp/Info.plist
      properties:
        # XcodeGen writes fixed defaults for these; keep them on the build settings releases bump.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(APP_URL_SCHEME)]
    # Enabled modules: one product line each. Remove a line to disable that module.
    dependencies:
      - package: StarterModules
        product: TemplateVersion
      - package: StarterModules
        product: Theme
      - package: StarterModules
        product: Onboarding
      - package: StarterModules
        product: Settings
      - package: StarterModules
        product: TabShell
      - package: StarterModules
        product: SessionTimer
      - package: StarterModules
        product: TimerRing
      - package: StarterModules
        product: Cues
      - package: StarterModules
        product: DurationPicker
    settings:
      base:
        # XcodeGen writes info.path relative to this file but resolves the setting from StarterApp/.
        INFOPLIST_FILE: StarterApp/Info.plist
        # User-facing name. Spaces are fine; this does not rename Swift modules.
        INFOPLIST_KEY_CFBundleDisplayName: "Starter App"
        # Name of Debug builds (run-on-device, simulator tests), so a development install on the
        # phone is told apart from the TestFlight one. Keep it short: the Home Screen truncates.
        DEV_DISPLAY_NAME: "Starter Dev"
        TARGETED_DEVICE_FAMILY: "1,2" # 1 = iPhone, 2 = iPad; either or both.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StarterApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # No non-exempt encryption in the template: Apple skips the per-build export-compliance question.
        # Revisit when an app adds networking or cryptography; see docs/human-steps.md.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: $(DEV_DISPLAY_NAME)
  StarterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarterApp/StarterAppTests
    dependencies:
      - target: StarterApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StarterAppTests
  StarterAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StarterApp/StarterAppUITests
        excludes: [Info.plist]
    info:
      path: StarterApp/StarterAppUITests/Info.plist
      properties:
        StarterAppURLScheme: $(APP_URL_SCHEME) # The deep-link test opens the app's own scheme.
    dependencies:
      - target: StarterApp
    settings:
      base:
        INFOPLIST_FILE: StarterAppUITests/Info.plist # Relative to StarterApp/, like the app's.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StarterAppUITests

schemes:
  StarterApp:
    build:
      targets:
        StarterApp: all
    test:
      targets:
        - StarterAppTests
        - StarterAppUITests
