name: TestFlight delivery

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md', 'LICENSE']
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: Configured app to deliver (use starter for your own manifest)
        type: choice
        required: true
        options: [starter, pocket-notes, starter-app-demo]
      perform_upload:
        description: Approve signing and uploading this app for internal TestFlight testing; main only
        type: boolean
        default: false

      retain_symbols:
        description: Retain debug symbols for 90 days (private repositories only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      TESTFLIGHT_BUILD_NUMBER_BASE: ${{ vars.TESTFLIGHT_BUILD_NUMBER_BASE }}
      IOS_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'starter-app-demo' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache verified public XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}
      - name: Verify native signing export without credentials
        run: |
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          case "$IOS_CONFIGURATION" in
            starter) export IOS_PROJECT_SPEC="$PWD/project.yml" ;;
            pocket-notes) export IOS_PROJECT_SPEC="$PWD/examples/pocket-notes.yml" ;;
            starter-app-demo) export IOS_PROJECT_SPEC="$PWD/examples/starter-app-demo.yml" ;;
            *) echo 'Unsupported manifest choice'; exit 2 ;;
          esac
          bash scripts/generate-project.sh
          python3 scripts/check-configuration.py --output "$RUNNER_TEMP/testflight-preflight/configuration.json"
          python3 scripts/check-signing-config.py "$RUNNER_TEMP/testflight-preflight/configuration.json"
          IOS_SIGNING_CONFIGURATION_EXPORT="$RUNNER_TEMP/testflight-preflight/configuration.json" python3 -m unittest discover -s scripts/tests -p 'test_signing.py' -v
          python3 scripts/testflight-release.py prepare --configuration "$RUNNER_TEMP/testflight-preflight/configuration.json" --run-number "${{ github.run_number }}" --run-attempt "${{ github.run_attempt }}" --output "$RUNNER_TEMP/testflight-preflight/release-plan.json" --export-options "$RUNNER_TEMP/testflight-preflight/ExportOptions.plist"
          IOS_BUILD_NUMBER="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["buildNumber"])' "$RUNNER_TEMP/testflight-preflight/release-plan.json")"
          xcrun altool --help > "$RUNNER_TEMP/altool-help.txt" 2>&1
          python3 - "$RUNNER_TEMP/altool-help.txt" <<'PYHELP'
          import sys
          from pathlib import Path
          help_text = Path(sys.argv[1]).read_text()
          if any(flag not in help_text for flag in ('--upload-package', '--p8-file-path', '--api-key', '--api-issuer', '--output-format')):
              raise SystemExit('Selected Xcode does not expose the reviewed upload command flags.')
          PYHELP
          xcodebuild archive \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/testflight-preflight/StarterApp.xcarchive" \
            -quiet \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER"
          python3 scripts/testflight-release.py verify --configuration "$RUNNER_TEMP/testflight-preflight/configuration.json" --plan "$RUNNER_TEMP/testflight-preflight/release-plan.json" --archive "$RUNNER_TEMP/testflight-preflight/StarterApp.xcarchive"
          IOS_SIGNING_CONFIGURATION_EXPORT="$RUNNER_TEMP/testflight-preflight/configuration.json" python3 -m unittest discover -s scripts/tests -p 'test_testflight.py' -v
          python3 scripts/collect-release-symbols.py --archive "$RUNNER_TEMP/testflight-preflight/StarterApp.xcarchive" --output "$RUNNER_TEMP/testflight-preflight/symbols.json" --commit "$GITHUB_SHA"
          python3 - "$RUNNER_TEMP/testflight-preflight/symbols.json" "$GITHUB_STEP_SUMMARY" <<'PYSYMBOLS'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          run_url = '/'.join((os.environ['GITHUB_SERVER_URL'], os.environ['GITHUB_REPOSITORY'], 'actions', 'runs', os.environ['GITHUB_RUN_ID']))
          lines = ['', '## Release symbol evidence', '',
                   '- Toolchain: Xcode 27.0 / iOS SDK 27.0.',
                   f"- App: `{report['bundleIdentifier']}` {report['marketingVersion']} ({report['buildNumber']})",
                   '- Scope: unsigned archive app/dSYM UUID comparison; no exported IPA in preflight.',
                   f"- UUID result: **{report['status']}**",
                   f'- Artifacts: [testflight-preflight]({run_url})']
          for image in report['images']:
              lines.append(f"- `{image['uuid']}` ({image['architecture']})")
          with Path(sys.argv[2]).open('a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PYSYMBOLS
          rm -rf "$RUNNER_TEMP/testflight-preflight/StarterApp.xcarchive"
          printf '## TestFlight preflight passed\n\nFresh native export, release tests, reviewed export options, upload-tool flags and an unsigned archive with planned build number passed. No credentials, authenticated reads, signing or upload were used.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-preflight
          path: |
            ${{ runner.temp }}/testflight-preflight/configuration.json
            ${{ runner.temp }}/testflight-preflight/release-plan.json
            ${{ runner.temp }}/testflight-preflight/ExportOptions.plist
            ${{ runner.temp }}/testflight-preflight/symbols.json
          retention-days: 7
  deliver:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.perform_upload && github.ref == 'refs/heads/main'
    environment: apple-credentials
    concurrency:
      group: testflight-delivery-${{ github.repository }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      TESTFLIGHT_BUILD_NUMBER_BASE: ${{ vars.TESTFLIGHT_BUILD_NUMBER_BASE }}
      IOS_CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Enforce private symbol retention
        if: inputs.retain_symbols
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = true

      - name: Initialize runner report directory
        run: echo "IOS_TEST_OUTPUT_DIR=$RUNNER_TEMP/ios-testflight" >> "$GITHUB_ENV"

      - name: Select and verify Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Select manifest
        id: spec
        run: |
          case "$IOS_CONFIGURATION" in
            starter) echo 'path=project.yml' >> "$GITHUB_OUTPUT" ;;
            pocket-notes) echo 'path=examples/pocket-notes.yml' >> "$GITHUB_OUTPUT" ;;
            starter-app-demo) echo 'path=examples/starter-app-demo.yml' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Generate project from selected manifest
        env:
          IOS_PROJECT_SPEC: ${{ steps.spec.outputs.path }}
        run: bash scripts/generate-project.sh

      - name: Export current app configuration
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check signing configuration
        id: app
        run: python3 scripts/check-signing-config.py "$IOS_TEST_OUTPUT_DIR/configuration.json" --output "$GITHUB_OUTPUT"

      - name: Prepare reviewed internal TestFlight export options
        run: python3 scripts/testflight-release.py prepare --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --run-number "${{ github.run_number }}" --run-attempt "${{ github.run_attempt }}" --output "$IOS_TEST_OUTPUT_DIR/offline-plan.json" --export-options "$IOS_TEST_OUTPUT_DIR/ExportOptions.plist"

      - name: Check key type
        env:
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test "$ASC_KEY_TYPE" = team
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"

      - name: Materialize private key without logging it
        id: key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/materialize-asc-key.py

      - name: Restore verified public CLI downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/asc
          key: asc-v1-${{ runner.os }}-${{ runner.arch }}-5.14.0-${{ hashFiles('scripts/install-asc.py', 'scripts/tool_download.py') }}

      - name: Install pinned App Store Connect CLI
        run: python3 scripts/install-asc.py

      - name: Read Apple account state for selected app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: python3 scripts/apple-doctor.py --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --account --asc build/tools/asc --output-dir "$IOS_TEST_OUTPUT_DIR/apple-diagnostics"

      - name: Require verified existing app identity before signing
        run: |
          python3 - "$IOS_TEST_OUTPUT_DIR/apple-diagnostics/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          findings = {item['check']: item['status'] for item in report['findings']}
          if report['accountSummary']['status'] != 'completed' or findings.get('app_record') != 'present' or findings.get('bundle_id') != 'present':
              raise SystemExit('Apple identity checks are incomplete; signing was not started.')
          PY

      - name: Plan a build number above verified existing builds
        id: release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: |
          python3 scripts/testflight-release.py plan --account --asc build/tools/asc --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --run-number "${{ github.run_number }}" --run-attempt "${{ github.run_attempt }}" --output "$IOS_TEST_OUTPUT_DIR/release-plan.json"
          python3 - "$IOS_TEST_OUTPUT_DIR/release-plan.json" "$GITHUB_OUTPUT" <<'PYPLAN'
          import json, sys
          from pathlib import Path
          with Path(sys.argv[2]).open('a') as stream:
              stream.write('build_number=' + json.loads(Path(sys.argv[1]).read_text())['buildNumber'] + '\n')
          PYPLAN

      - name: Archive without account-side signing changes
        env:
          IOS_SIGNING_TEAM: ${{ steps.app.outputs.teamIdentifier }}
          IOS_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StarterApp.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            "DEVELOPMENT_TEAM=$IOS_SIGNING_TEAM" \
            "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
            | xcbeautify

      - name: Export App Store Connect distribution package
        id: distribution
        env:
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          EXPORT_DIR="$RUNNER_TEMP/ios-testflight/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StarterApp.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$IOS_TEST_OUTPUT_DIR/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            | xcbeautify
          IPA_COUNT="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          test "$IPA_COUNT" = 1
          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          printf 'ipa_path=%s\n' "$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate exact archive-derived package and planned version
        env:
          IPA_PATH: ${{ steps.distribution.outputs.ipa_path }}
        run: python3 scripts/testflight-release.py validate --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --plan "$IOS_TEST_OUTPUT_DIR/release-plan.json" --archive "$RUNNER_TEMP/StarterApp.xcarchive" --ipa "$IPA_PATH" --output "$IOS_TEST_OUTPUT_DIR/delivery-validation.json"

      - name: Verify release symbols and prepare optional retention
        env:
          RETAIN_SYMBOLS: ${{ inputs.retain_symbols }}
          IPA_PATH: ${{ steps.distribution.outputs.ipa_path }}
        run: |
          SYMBOL_ARGS=()
          if [ "$RETAIN_SYMBOLS" = true ]; then
            SYMBOL_ARGS=(--retain "$RUNNER_TEMP/release-symbols")
          fi
          python3 scripts/collect-release-symbols.py --archive "$RUNNER_TEMP/StarterApp.xcarchive" --ipa "$IPA_PATH" --output "$IOS_TEST_OUTPUT_DIR/symbols.json" --commit "$GITHUB_SHA" "${SYMBOL_ARGS[@]}"

      - name: Retain verified symbols before upload
        if: inputs.retain_symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-symbols-${{ inputs.configuration }}-${{ steps.release.outputs.build_number }}
          path: ${{ runner.temp }}/release-symbols
          retention-days: 90
          if-no-files-found: error

      - name: Upload validated package to App Store Connect
        env:
          IPA_PATH: ${{ steps.distribution.outputs.ipa_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: python3 scripts/testflight-release.py upload --perform-upload --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --plan "$IOS_TEST_OUTPUT_DIR/release-plan.json" --ipa "$IPA_PATH" --validation "$IOS_TEST_OUTPUT_DIR/delivery-validation.json" --output "$IOS_TEST_OUTPUT_DIR/upload-report.json"

      - name: Read processing state without claiming tester availability
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: python3 scripts/testflight-release.py processing --account --asc build/tools/asc --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --plan "$IOS_TEST_OUTPUT_DIR/release-plan.json" --output "$IOS_TEST_OUTPUT_DIR/processing-report.json"

      - name: Publish delivery summary
        if: always()
        run: |
          python3 - "$IOS_TEST_OUTPUT_DIR" "$GITHUB_STEP_SUMMARY" <<'PYSUMMARY'
          import json, sys
          from pathlib import Path
          directory = Path(sys.argv[1]); directory.mkdir(parents=True, exist_ok=True)
          lines = ['## Internal TestFlight delivery', '', 'Signing, upload acceptance, Apple processing and iPhone installation are separate checks.', '']
          for name in ('release-plan', 'delivery-validation', 'upload-report', 'processing-report'):
              path = directory / (name + '.json')
              report = json.loads(path.read_text()) if path.is_file() else {}
              lines.append('- ' + name + ': **' + report.get('status', 'not_completed') + '**')
          lines += ['', 'Open App Store Connect to verify processing, export compliance and internal tester access. Device installation remains a Windows/iPhone acceptance step.', 'If upload failed or timed out, check App Store Connect before dispatching again.']
          content = '\n'.join(lines) + '\n'
          (directory / 'summary.md').write_text(content)
          with Path(sys.argv[2]).open('a') as stream: stream.write(content)
          PYSUMMARY

      - name: Upload sanitized delivery reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-delivery-${{ inputs.configuration }}
          path: |
            ${{ runner.temp }}/ios-testflight/configuration.json
            ${{ runner.temp }}/ios-testflight/release-plan.json
            ${{ runner.temp }}/ios-testflight/delivery-validation.json
            ${{ runner.temp }}/ios-testflight/upload-report.json
            ${{ runner.temp }}/ios-testflight/processing-report.json
            ${{ runner.temp }}/ios-testflight/summary.md
            ${{ runner.temp }}/ios-testflight/symbols.json
          retention-days: 7
          if-no-files-found: warn

      - name: Remove signing material and archive
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-private-key.p8"
          rm -rf "$RUNNER_TEMP/StarterApp.xcarchive" "$RUNNER_TEMP/ios-testflight/export" "$RUNNER_TEMP/ios-testflight/distribution-package" "$RUNNER_TEMP/signing-certificates" "$RUNNER_TEMP/release-symbols"
