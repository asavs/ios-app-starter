name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: App to test manually; pull requests test starter, main tests all three
        type: choice
        default: all
        options: [all, starter, pocket-notes, starter-app-demo]
      verify_failure_reporting:
        description: 'Deliberately fail the smoke test to check reports (expected red run)'
        type: boolean
        default: false

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_reporting && 'iOS (deliberate test failure)' || 'iOS' }}

# PR updates and newer main pushes replace obsolete runs; manual runs stay independent.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  # Decide whether the simulator gate must run. Documentation-only pull requests and drafts skip it;
  # the ios-gate job below still reports a result so a required check is never silently "skipped".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      modules: ${{ steps.decide.outputs.modules }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the change
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          modules="$(python3 -c 'import json,pathlib; p=pathlib.Path("Modules"); print(json.dumps(sorted(d.name for d in p.iterdir() if d.is_dir()) if p.is_dir() else []))')"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=$EVENT event always runs" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=draft pull request; mark it ready for review to run the simulator gate" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'Changed files:\n%s\n' "$changed"
          code="$(printf '%s\n' "$changed" | grep -v -E '^(docs/|[^/]+\.md$|LICENSE$)' || true)"
          if [ -z "$code" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=documentation-only change; simulator gate not needed" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=code, manifest, script or workflow files changed" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(github.event_name == 'pull_request' && '["starter"]' || (github.event_name == 'workflow_dispatch' && inputs.configuration != 'all') && format('["{0}"]', inputs.configuration) || '["starter","pocket-notes","starter-app-demo"]') }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
      IOS_SPM_CACHE_DIR: ${{ github.workspace }}/build/swiftpm-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Cache verified XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}

      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-cache
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'project.yml', 'examples/*.yml') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-

      - name: Generate Xcode project
        env:
          IOS_PROJECT_SPEC: ${{ matrix.configuration == 'starter' && 'project.yml' || matrix.configuration == 'pocket-notes' && 'examples/pocket-notes.yml' || 'examples/starter-app-demo.yml' }}
        run: bash scripts/generate-project.sh

      - name: Check resolved app configuration
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check module library layout and enablement
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-modules.py --output "$IOS_TEST_OUTPUT_DIR/modules.json"

      - name: Check app icon document and render previews
        if: matrix.configuration == 'starter'
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-app-icon.py --output "$IOS_TEST_OUTPUT_DIR/icon"

      - name: Verify invalid configurations fail clearly
        if: matrix.configuration == 'starter'
        run: python3 scripts/tests/check-configurations.py

      - name: Verify report handling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify pinned agent skills without network access
        run: python3 scripts/sync-skills.py

      - name: Inject deliberate assertion failure in runner checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_reporting }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('StarterApp/StarterAppUITests/StarterAppUITests.swift')
          source = path.read_text()
          needle = 'XCTAssertTrue(visible, "Welcome text should be visible")'
          assert source.count(needle) == 1, 'Smoke-test assertion changed; update failure probe.'
          path.write_text(source.replace(needle, needle + '\n        XCTFail("Deliberate failure probe: verify report delivery")'))
          PY

      - name: Prepare simulator
        timeout-minutes: 5
        run: python3 scripts/prepare-simulator.py

      - name: Build and test iOS app
        id: ios_tests
        timeout-minutes: 20
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
          IOS_TEST_ARTIFACT_NAME: ios-test-results-${{ matrix.configuration }}
        run: bash scripts/test-ios.sh

      - name: Verify built app identity and minimum OS
        if: ${{ !cancelled() && steps.ios_tests.outcome != 'skipped' }}
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
          IOS_TEST_ARTIFACT_NAME: ios-test-results-${{ matrix.configuration }}
        run: python3 scripts/check-built-app.py "$IOS_TEST_OUTPUT_DIR/configuration.json" "$IOS_TEST_OUTPUT_DIR"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-test-results-${{ matrix.configuration }}
          path: |
            ${{ runner.temp }}/ios-test-results/configuration.json
            ${{ runner.temp }}/ios-test-results/modules.json
            ${{ runner.temp }}/ios-test-results/built-app.json
            ${{ runner.temp }}/ios-test-results/icon/app-icon.json
            ${{ runner.temp }}/ios-test-results/icon/*.png
            ${{ runner.temp }}/ios-test-results/run.*/summary.md
            ${{ runner.temp }}/ios-test-results/run.*/failures.json
            ${{ runner.temp }}/ios-test-results/run.*/results.json
            ${{ runner.temp }}/ios-test-results/run.*/tests.json
            ${{ runner.temp }}/ios-test-results/run.*/attachments/manifest.json
            ${{ runner.temp }}/ios-test-results/run.*/attachments/*.png
            ${{ runner.temp }}/ios-test-results/run.*/attachments/*.mp4
            ${{ runner.temp }}/ios-test-results/run.*/exit-status.txt
            ${{ runner.temp }}/ios-test-results/run.*/*.log
            ${{ runner.temp }}/ios-test-results/run.*/Tests.xcresult
          retention-days: 14
          if-no-files-found: warn

  # Run each package test target as its own required matrix lane. The list comes from Modules/ so
  # adding a module does not require maintaining a second inventory in this workflow.
  module-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.modules != '[]'
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      IOS_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.0
      IOS_SPM_CACHE_DIR: ${{ github.workspace }}/build/swiftpm-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-cache
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'project.yml', 'examples/*.yml') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-
      - name: Prepare simulator
        timeout-minutes: 5
        run: python3 scripts/prepare-simulator.py
      - name: Test module ${{ matrix.module }}
        id: module_tests
        timeout-minutes: 20
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/module-test-results
        run: bash scripts/test-module.sh "${{ matrix.module }}"
      - name: Upload module test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: module-test-results-${{ matrix.module }}
          path: ${{ runner.temp }}/module-test-results
          retention-days: 14
          if-no-files-found: warn

  no-modules:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Generate app with all modules disabled
        env:
          IOS_PROJECT_SPEC: examples/no-modules.yml
        run: bash scripts/generate-project.sh
      - name: Verify no module products are enabled
        run: |
          python3 scripts/check-modules.py --output "$RUNNER_TEMP/modules.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["enabled"] == [], "Expected no module products enabled"' "$RUNNER_TEMP/modules.json"
      - name: Build app without modules
        run: xcodebuild -project StarterApp/StarterApp.xcodeproj -scheme StarterApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # The single required check for pull requests. Passes when the simulator lane passed, or when the
  # change was documentation-only. Fails for drafts and for any failed, cancelled or missing lane.
  ios-gate:
    needs: [changes, test, module-tests, no-modules]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate gate
        env:
          RUN: ${{ needs.changes.outputs.run }}
          REASON: ${{ needs.changes.outputs.reason }}
          TEST_RESULT: ${{ needs.test.result }}
          MODULE_RESULT: ${{ needs.module-tests.result }}
          NO_MODULES_RESULT: ${{ needs.no-modules.result }}
        run: |
          echo "Simulator gate requested: $RUN ($REASON); app tests: $TEST_RESULT; module tests: $MODULE_RESULT; no-modules build: $NO_MODULES_RESULT"
          if [ "$RUN" = "true" ] && [ "$TEST_RESULT" = "success" ] && [ "$MODULE_RESULT" = "success" ] && [ "$NO_MODULES_RESULT" = "success" ]; then
            echo "## iOS gate: passed" >> "$GITHUB_STEP_SUMMARY"; echo "App smoke tests, per-module tests and the no-modules build passed." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ "$RUN" = "false" ] && [ "$TEST_RESULT" = "skipped" ] && [ "$MODULE_RESULT" = "skipped" ] && [ "$NO_MODULES_RESULT" = "skipped" ] && [ "${REASON#documentation-only}" != "$REASON" ]; then
            echo "## iOS gate: passed (documentation-only)" >> "$GITHUB_STEP_SUMMARY"; echo "$REASON" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "## iOS gate: not passed" >> "$GITHUB_STEP_SUMMARY"; echo "$REASON; test job result: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          exit 1
