name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: App to test manually; pull requests test starter, main tests all three
        type: choice
        default: all
        options: [all, starter, pocket-notes, starter-app-demo]
      verify_failure_reporting:
        description: 'Deliberately fail the smoke test to check reports (expected red run)'
        type: boolean
        default: false

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_reporting && 'iOS (deliberate test failure)' || 'iOS' }}

# PR updates and newer main pushes replace obsolete runs; manual runs stay independent.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  # Decide whether the simulator gate must run. Documentation-only pull requests and drafts skip it;
  # the ios-gate job below still reports a result so a required check is never silently "skipped".
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      modules: ${{ steps.decide.outputs.modules }}
      # Opt-in with the repository variable SELF_HOSTED_MAC=true: pushes to main and manual runs then go
      # to the owner's Mac (a self-hosted runner labelled starter-mac), so main's ten jobs leave GitHub's
      # five concurrent macOS slots to pull requests (2026-11-09). Without it, or for any pull request,
      # GitHub's runners as before, so a repository made from the template needs no Mac. Fork pull
      # requests never reach the Mac: this is chosen by event, and fork workflows need the owner's
      # approval to run at all. The Mac's own simulator keeps the owner's "iPhone 17" free.
      # Decided in a step and given as a single label, which keeps the routing in one readable place.
      # (Dispatches failed with "Internal server error" while this was written; that was a GitHub
      # Actions outage on 2026-11-09, not this expression.) Only the owner's runner has starter-mac.
      mac_runner: ${{ steps.runner.outputs.mac_runner }}
      simulator: ${{ steps.runner.outputs.simulator }}
      # Pull requests test the demo only: it enables every module, so its lanes run every test the
      # minimal template's would and more, and the no-modules lane still builds the template without
      # any (2026-11-04, ios-6dd.13). A push to main tests the two the pull request didn't: nine lanes at
      # once ran each test two to three times slower than the pull request's three and timed out three
      # merges in a row (2026-11-07). A manual run tests the one it names, or all three.
      configurations: ${{ github.event_name == 'pull_request' && '["starter-app-demo"]' || github.event_name == 'push' && '["starter","pocket-notes"]' || inputs.configuration != 'all' && format('["{0}"]', inputs.configuration) || '["starter","pocket-notes","starter-app-demo"]' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose the macOS runner
        id: runner
        env:
          EVENT: ${{ github.event_name }}
          SELF_HOSTED_MAC: ${{ vars.SELF_HOSTED_MAC }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$SELF_HOSTED_MAC" = true ]; then
            echo "mac_runner=starter-mac" >> "$GITHUB_OUTPUT"
            echo "simulator=platform=iOS Simulator,name=CI iPhone 17,OS=27.0" >> "$GITHUB_OUTPUT"
          else
            echo "mac_runner=xcode-27" >> "$GITHUB_OUTPUT"
            echo "simulator=platform=iOS Simulator,name=iPhone 17,OS=27.0" >> "$GITHUB_OUTPUT"
          fi
      - name: Classify the change
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          modules="$(python3 -c 'import json,pathlib; p=pathlib.Path("Modules"); print(json.dumps(sorted(d.name for d in p.iterdir() if d.is_dir()) if p.is_dir() else []))')"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=$EVENT event always runs" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=draft pull request; mark it ready for review to run the simulator gate" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf 'Changed files:\n%s\n' "$changed"
          code="$(printf '%s\n' "$changed" | grep -v -E '^(docs/|[^/]+\.md$|LICENSE$)' || true)"
          if [ -z "$code" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=documentation-only change; simulator gate not needed" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=code, manifest, script or workflow files changed" >> "$GITHUB_OUTPUT"
          fi

  # Build each configuration once for testing; its lanes then test that build on their own simulators.
  # Every lane used to build the same app, which took 5 to 12 minutes of each (2026-11-07).
  build:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.changes.outputs.configurations) }}
    runs-on: ${{ needs.changes.outputs.mac_runner }}
    timeout-minutes: 35
    env:
      IOS_TEST_DESTINATION: ${{ needs.changes.outputs.simulator }}
      IOS_SPM_CACHE_DIR: ${{ github.workspace }}/build/swiftpm-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode
        # Hosted runners: exactly Xcode 27.0 and its SDK. The owner's Mac (self-hosted, main and manual
        # runs): the Xcode it has selected, any 27.x; the log says which (2026-11-09).
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            developer_dir="$(xcode-select -p)"
            version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)"
            case "$version" in 'Xcode 27.'*) ;; *) echo "The self-hosted runner needs Xcode 27; it has $version" >&2; exit 1 ;; esac
          else
            developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
            test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)" = 'Xcode 27.0'
            test "$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          fi
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Cache verified XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}

      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-cache
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'project.yml', 'examples/*.yml') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-

      - name: Generate Xcode project
        env:
          IOS_PROJECT_SPEC: ${{ matrix.configuration == 'starter' && 'project.yml' || matrix.configuration == 'pocket-notes' && 'examples/pocket-notes.yml' || 'examples/starter-app-demo.yml' }}
        run: bash scripts/generate-project.sh

      - name: Check resolved app configuration
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check module library layout and enablement
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-modules.py --output "$IOS_TEST_OUTPUT_DIR/modules.json"

      - name: Check module string catalogs
        run: python3 scripts/check-module-strings.py

      - name: Check the UI-test identifier contract
        run: python3 scripts/check-ui-identifiers.py

      - name: Check app icon document and render previews
        if: matrix.configuration == 'starter' || matrix.configuration == 'starter-app-demo'
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-app-icon.py --output "$IOS_TEST_OUTPUT_DIR/icon"

      - name: Verify invalid configurations fail clearly
        if: matrix.configuration == 'starter' || matrix.configuration == 'starter-app-demo'
        run: python3 scripts/tests/check-configurations.py

      - name: Inject deliberate assertion failure in runner checkout
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure_reporting }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('StarterApp/StarterAppUITests/StarterAppUITests.swift')
          source = path.read_text()
          needle = 'XCTAssertTrue(visible, "Welcome text should be visible")'
          assert source.count(needle) == 1, 'Smoke-test assertion changed; update failure probe.'
          path.write_text(source.replace(needle, needle + '\n        XCTFail("Deliberate failure probe: verify report delivery")'))
          PY

      - name: Build for testing
        id: ios_build
        timeout-minutes: 25
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
          IOS_TEST_ACTION: build
          IOS_TEST_ARTIFACT_NAME: ios-test-results-${{ matrix.configuration }}-build
        run: bash scripts/test-ios.sh

      - name: Verify built app identity and minimum OS
        if: ${{ !cancelled() && steps.ios_build.outcome != 'skipped' }}
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: python3 scripts/check-built-app.py "$IOS_TEST_OUTPUT_DIR/configuration.json" "$IOS_TEST_OUTPUT_DIR"

      # The products and the reports the lanes pass on, with the modules the build enables; the lanes
      # put them back where a single job would have left them, so their artifacts keep the same files.
      - name: Collect the build for the lanes
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/ios-build"
          mkdir -p "$bundle/reports"
          products="$(ls -d "$IOS_TEST_OUTPUT_DIR"/run.*/DerivedData/Build/Products)"
          mv "$products" "$bundle/products"
          ls "$bundle/products"/*.xctestrun
          python3 -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["enabled"]))' "$IOS_TEST_OUTPUT_DIR/modules.json" > "$bundle/enabled-modules.txt"
          cd "$IOS_TEST_OUTPUT_DIR"
          for item in configuration.json modules.json built-app.json icon; do
            if [ -e "$item" ]; then cp -R "$item" "$bundle/reports/"; fi
          done

      - name: Upload the build for the lanes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-build-${{ matrix.configuration }}
          path: ${{ runner.temp }}/ios-build
          retention-days: 1
          if-no-files-found: error

      - name: Upload build reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-test-results-${{ matrix.configuration }}-build
          path: |
            ${{ runner.temp }}/ios-test-results/configuration.json
            ${{ runner.temp }}/ios-test-results/modules.json
            ${{ runner.temp }}/ios-test-results/run.*/summary.md
            ${{ runner.temp }}/ios-test-results/run.*/failures.json
            ${{ runner.temp }}/ios-test-results/run.*/exit-status.txt
            ${{ runner.temp }}/ios-test-results/run.*/*.log
            ${{ runner.temp }}/ios-test-results/run.*/Tests.xcresult
          retention-days: 14
          if-no-files-found: warn

  test:
    needs: [changes, build]
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(needs.changes.outputs.configurations) }}
        # Three lanes per configuration, each on its own simulator: the whole UI suite on one runner takes
        # over 25 minutes (ios-6dd.13). `scripts/test-ios.sh` maps the lane to test classes.
        lane: [shell, features, tabs]
    runs-on: ${{ needs.changes.outputs.mac_runner }}
    # Pull requests keep the tight limits of a required check; main and manual runs aren't required and
    # share runners with everything else, so they get room to finish rather than fail on the clock.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 50 }}
    env:
      IOS_TEST_DESTINATION: ${{ needs.changes.outputs.simulator }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode
        # Hosted runners: exactly Xcode 27.0 and its SDK. The owner's Mac (self-hosted, main and manual
        # runs): the Xcode it has selected, any 27.x; the log says which (2026-11-09).
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            developer_dir="$(xcode-select -p)"
            version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)"
            case "$version" in 'Xcode 27.'*) ;; *) echo "The self-hosted runner needs Xcode 27; it has $version" >&2; exit 1 ;; esac
          else
            developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
            test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)" = 'Xcode 27.0'
            test "$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          fi
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Prepare simulator
        timeout-minutes: 5
        run: python3 scripts/prepare-simulator.py

      - name: Download the configuration's build
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ios-build-${{ matrix.configuration }}
          path: ${{ runner.temp }}/ios-build

      - name: Restore the build's reports
        run: |
          mkdir -p "$RUNNER_TEMP/ios-test-results"
          cp -R "$RUNNER_TEMP/ios-build/reports/." "$RUNNER_TEMP/ios-test-results/"

      - name: Test the build
        id: ios_tests
        # One lane's classes, serially, against the build job's products. Two simulator clones in one
        # job (IOS_TEST_WORKERS: 2) were measured on 2026-11-01: no test ran for 18 minutes until the
        # step timed out, so the clones never came up. ios-6dd.13 tracks the rest.
        timeout-minutes: ${{ github.event_name == 'pull_request' && 25 || 40 }}
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-test-results
          IOS_TEST_ARTIFACT_NAME: ios-test-results-${{ matrix.configuration }}-${{ matrix.lane }}
          IOS_TEST_LANE: ${{ matrix.lane }}
          IOS_TEST_ACTION: run
          # A failed test gets a second attempt; the report lists every test that needed one (2026-11-08).
          IOS_TEST_ATTEMPTS: '2'
        run: |
          IOS_XCTESTRUN="$(ls "$RUNNER_TEMP"/ios-build/products/*.xctestrun)"
          IOS_ENABLED_MODULES="$(cat "$RUNNER_TEMP/ios-build/enabled-modules.txt")"
          export IOS_XCTESTRUN IOS_ENABLED_MODULES
          bash scripts/test-ios.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-test-results-${{ matrix.configuration }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/ios-test-results/configuration.json
            ${{ runner.temp }}/ios-test-results/modules.json
            ${{ runner.temp }}/ios-test-results/built-app.json
            ${{ runner.temp }}/ios-test-results/icon/app-icon.json
            ${{ runner.temp }}/ios-test-results/icon/*.png
            ${{ runner.temp }}/ios-test-results/run.*/summary.md
            ${{ runner.temp }}/ios-test-results/run.*/failures.json
            ${{ runner.temp }}/ios-test-results/run.*/results.json
            ${{ runner.temp }}/ios-test-results/run.*/tests.json
            ${{ runner.temp }}/ios-test-results/run.*/attachments/**
            ${{ runner.temp }}/ios-test-results/run.*/diagnostics/**/*.log
            ${{ runner.temp }}/ios-test-results/run.*/exit-status.txt
            ${{ runner.temp }}/ios-test-results/run.*/*.log
            ${{ runner.temp }}/ios-test-results/run.*/Tests.xcresult
          retention-days: 14
          if-no-files-found: warn

  module-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.modules != '[]'
    runs-on: ${{ needs.changes.outputs.mac_runner }}
    timeout-minutes: 45
    env:
      IOS_TEST_DESTINATION: ${{ needs.changes.outputs.simulator }}
      IOS_SPM_CACHE_DIR: ${{ github.workspace }}/build/swiftpm-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        # Hosted runners: exactly Xcode 27.0 and its SDK. The owner's Mac (self-hosted, main and manual
        # runs): the Xcode it has selected, any 27.x; the log says which (2026-11-09).
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            developer_dir="$(xcode-select -p)"
            version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)"
            case "$version" in 'Xcode 27.'*) ;; *) echo "The self-hosted runner needs Xcode 27; it has $version" >&2; exit 1 ;; esac
          else
            developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
            test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)" = 'Xcode 27.0'
            test "$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          fi
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Cache Swift package sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/swiftpm-cache
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('**/Package.resolved', '**/Package.swift', 'project.yml', 'examples/*.yml') }}
          restore-keys: |
            swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-
      - name: Prepare simulator
        timeout-minutes: 5
        run: python3 scripts/prepare-simulator.py
      - name: Test every module
        id: module_tests
        timeout-minutes: 40
        env:
          IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/module-test-results
        run: bash scripts/test-module.sh all
      - name: Upload module test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: module-test-results-all
          path: ${{ runner.temp }}/module-test-results
          retention-days: 14
          if-no-files-found: warn

  no-modules:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ needs.changes.outputs.mac_runner }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        # Hosted runners: exactly Xcode 27.0 and its SDK. The owner's Mac (self-hosted, main and manual
        # runs): the Xcode it has selected, any 27.x; the log says which (2026-11-09).
        run: |
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            developer_dir="$(xcode-select -p)"
            version="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)"
            case "$version" in 'Xcode 27.'*) ;; *) echo "The self-hosted runner needs Xcode 27; it has $version" >&2; exit 1 ;; esac
          else
            developer_dir=/Applications/Xcode_27.0.app/Contents/Developer
            test "$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | head -n 1)" = 'Xcode 27.0'
            test "$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          fi
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
      - name: Generate app with all modules disabled
        env:
          IOS_PROJECT_SPEC: examples/no-modules.yml
        run: bash scripts/generate-project.sh
      - name: Verify no module products are enabled
        run: |
          python3 scripts/check-modules.py --output "$RUNNER_TEMP/modules.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); assert data["enabled"] == [], "Expected no module products enabled"' "$RUNNER_TEMP/modules.json"
      - name: Build app without modules
        run: xcodebuild -project StarterApp/StarterApp.xcodeproj -scheme StarterApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # The single required check for pull requests. Passes when the simulator lane passed, or when the
  # change was documentation-only. Fails for drafts and for any failed, cancelled or missing lane.
  ios-gate:
    needs: [changes, build, test, module-tests, no-modules]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate gate
        env:
          RUN: ${{ needs.changes.outputs.run }}
          REASON: ${{ needs.changes.outputs.reason }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MODULE_RESULT: ${{ needs.module-tests.result }}
          NO_MODULES_RESULT: ${{ needs.no-modules.result }}
        run: |
          echo "Simulator gate requested: $RUN ($REASON); app build: $BUILD_RESULT; app tests: $TEST_RESULT; module tests: $MODULE_RESULT; no-modules build: $NO_MODULES_RESULT"
          if [ "$RUN" = "true" ] && [ "$BUILD_RESULT" = "success" ] && [ "$TEST_RESULT" = "success" ] && [ "$MODULE_RESULT" = "success" ] && [ "$NO_MODULES_RESULT" = "success" ]; then
            echo "## iOS gate: passed" >> "$GITHUB_STEP_SUMMARY"; echo "App smoke tests, per-module tests and the no-modules build passed." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ "$RUN" = "false" ] && [ "$BUILD_RESULT" = "skipped" ] && [ "$TEST_RESULT" = "skipped" ] && [ "$MODULE_RESULT" = "skipped" ] && [ "$NO_MODULES_RESULT" = "skipped" ] && [ "${REASON#documentation-only}" != "$REASON" ]; then
            echo "## iOS gate: passed (documentation-only)" >> "$GITHUB_STEP_SUMMARY"; echo "$REASON" >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "## iOS gate: not passed" >> "$GITHUB_STEP_SUMMARY"; echo "$REASON; build job result: $BUILD_RESULT; test job result: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          exit 1
