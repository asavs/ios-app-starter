name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: bash scripts/generate-project.sh

      - name: Build and test iOS app
        run: |
          xcodebuild \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:StarterAppUITests/StarterAppUITests/testWelcomeScreen \
            CODE_SIGNING_ALLOWED=NO \
            test
