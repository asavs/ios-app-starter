name: Apple diagnostics
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Native app manifest to inspect (edit project.yml for your own app)'
        type: choice
        options: [starter, pocket-notes, starter-app-demo]
        default: starter
      account:
        description: 'Opt in to read-only Apple account checks using apple-credentials environment secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      ASC_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify requested account-check warning without credentials
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Explicitly clear credential fields: this probe must never contact Apple.
          ASC_KEY_ID= ASC_ISSUER_ID= ASC_PRIVATE_KEY= ASC_PRIVATE_KEY_PATH= ASC_PRIVATE_KEY_B64= python3 scripts/apple-doctor.py --account --output-dir build/missing-credentials-probe
      - name: Cache verified public CLI downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/asc
          key: asc-v1-${{ runner.os }}-${{ runner.arch }}-5.14.0-${{ hashFiles('scripts/install-asc.py', 'scripts/tool_download.py') }}
      - name: Download pinned native CLI
        run: python3 scripts/install-asc.py
      - name: Exercise native CLI without credentials
        shell: bash
        run: |
          binary=build/tools/asc
          if test -f build/tools/asc.exe; then binary=build/tools/asc.exe; fi
          "$binary" version
          "$binary" apps list --help
          "$binary" bundle-ids list --help
          "$binary" certificates list --help
          "$binary" bundle-ids profiles list --help
      - name: Verify same-job tool download reuse
        run: python3 scripts/install-asc.py
      - name: Test diagnostics, reports and download-cache integrity
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Write credential-free readiness report
        run: python3 scripts/apple-doctor.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-diagnostics-${{ matrix.os }}
          path: build/apple-diagnostics/
          retention-days: 14
  configuration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache verified XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}

      - name: Verify toolchain and export current configuration
        env:
          SELECTED_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          case "$SELECTED_CONFIGURATION" in
            starter) export IOS_PROJECT_SPEC="$PWD/project.yml" ;;
            pocket-notes) export IOS_PROJECT_SPEC="$PWD/examples/pocket-notes.yml" ;;
            starter-app-demo) export IOS_PROJECT_SPEC="$PWD/examples/starter-app-demo.yml" ;;
            *) echo 'Unsupported configuration selection'; exit 1 ;;
          esac
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          bash scripts/generate-project.sh
          python3 scripts/check-configuration.py --output build/configuration.json
          printf '## Selected app configuration\n\nManifest: `%s`\n\nCommit: `%s`\n\n' "${IOS_PROJECT_SPEC#"$PWD/"}" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json; print("Bundle identifier: `" + json.load(open("build/configuration.json"))[0]["bundleIdentifier"] + "`\n")' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/apple-doctor.py --configuration build/configuration.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-configuration
          path: build/configuration.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-project-diagnostics
          path: build/apple-diagnostics/
  account:
    needs: [portable, configuration]
    if: github.event_name == 'workflow_dispatch' && inputs.account && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: apple-credentials
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: apple-configuration
          path: build
      - name: Restore verified public CLI downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/asc
          key: asc-v1-${{ runner.os }}-${{ runner.arch }}-5.14.0-${{ hashFiles('scripts/install-asc.py', 'scripts/tool_download.py') }}
      - run: python3 scripts/install-asc.py
      - name: Read account state and write sanitized report
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE || 'team' }}
        run: python3 scripts/apple-doctor.py --configuration build/configuration.json --account --asc build/tools/asc.exe
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: apple-credentials-diagnostics
          path: build/apple-diagnostics/
          retention-days: 7
