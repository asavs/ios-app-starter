name: TestFlight groups

# Plan, and on explicit request create, an internal TestFlight group with automatic distribution
# and add App Store Connect users of one role to it. Reads happen on every dispatch; the two
# write kinds (create group, add tester) run only with apply=true from main behind the protected
# environment. Nothing is deleted or modified. Reports carry counts and statuses, never identities.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configured app whose App Store Connect record owns the group
        type: choice
        required: true
        options: [starter, pocket-notes, starter-app-demo]
      group_name:
        description: Internal group name (created with access to all builds if absent)
        type: string
        default: dev-auto
      tester_role:
        description: Add every App Store Connect user with this role to the group
        type: choice
        default: ACCOUNT_HOLDER
        options: [ACCOUNT_HOLDER, ADMIN, APP_MANAGER]
      apply:
        description: Create the group and add testers as planned; main only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  groups:
    if: github.ref == 'refs/heads/main'
    environment: apple-credentials
    concurrency:
      group: testflight-groups-${{ github.repository }}
      cancel-in-progress: false
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      IOS_CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize runner report directory
        run: echo "IOS_TEST_OUTPUT_DIR=$RUNNER_TEMP/testflight-groups" >> "$GITHUB_ENV"

      - name: Select and verify Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Select manifest
        id: spec
        run: |
          case "$IOS_CONFIGURATION" in
            starter) echo 'path=project.yml' >> "$GITHUB_OUTPUT" ;;
            pocket-notes) echo 'path=examples/pocket-notes.yml' >> "$GITHUB_OUTPUT" ;;
            starter-app-demo) echo 'path=examples/starter-app-demo.yml' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Cache verified public XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}

      - name: Generate project from selected manifest
        env:
          IOS_PROJECT_SPEC: ${{ steps.spec.outputs.path }}
        run: bash scripts/generate-project.sh

      - name: Export current app configuration
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check key type
        env:
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test "$ASC_KEY_TYPE" = team
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"

      - name: Materialize private key without logging it
        id: key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/materialize-asc-key.py

      - name: Restore verified public CLI downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/asc
          key: asc-v1-${{ runner.os }}-${{ runner.arch }}-5.14.0-${{ hashFiles('scripts/install-asc.py', 'scripts/tool_download.py') }}

      - name: Install pinned App Store Connect CLI
        run: python3 scripts/install-asc.py

      - name: Plan group and tester changes (read-only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          GROUP_NAME: ${{ inputs.group_name }}
          TESTER_ROLE: ${{ inputs.tester_role }}
        run: python3 scripts/testflight-groups.py --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --account --asc build/tools/asc --group-name "$GROUP_NAME" --tester-role "$TESTER_ROLE" --output "$IOS_TEST_OUTPUT_DIR/plan.json"

      - name: Apply planned changes
        if: inputs.apply
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          GROUP_NAME: ${{ inputs.group_name }}
          TESTER_ROLE: ${{ inputs.tester_role }}
        run: python3 scripts/testflight-groups.py --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --account --asc build/tools/asc --group-name "$GROUP_NAME" --tester-role "$TESTER_ROLE" --apply --output "$IOS_TEST_OUTPUT_DIR/apply.json"

      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: testflight-groups-${{ inputs.configuration }}
          path: |
            ${{ runner.temp }}/testflight-groups/plan.json
            ${{ runner.temp }}/testflight-groups/apply.json
          retention-days: 7
          if-no-files-found: warn

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-private-key.p8"
