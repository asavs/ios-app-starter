name: Workflow lint

# A workflow file GitHub can't load fails without running any job, and the pull request then shows no
# checks for it at all, so a broken iOS workflow can't report its own mistake. This lint runs in a file
# of its own, on Linux, whenever a workflow or the lint changes (2026-11-07).
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'scripts/lint-workflows.py'
      - 'scripts/tool_download.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Release downloads have failed with HTTP 504 four times in a row (2026-11-08); every hit is
      # still checksum-verified by tool_download.py.
      - name: Cache verified actionlint archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/actionlint
          key: actionlint-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lint-workflows.py', 'scripts/tool_download.py') }}
      - name: Lint workflows with the pinned actionlint
        run: python3 scripts/lint-workflows.py
