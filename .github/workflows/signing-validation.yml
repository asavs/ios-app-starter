name: Signed archive validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      configuration:
        description: App configuration to sign
        type: choice
        required: true
        options: [starter, pocket-notes, starter-app-demo]
      perform_signing:
        description: Approve authenticated reads and automatic signing (may create profiles/certificates); main only
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_CONFIGURATION: ${{ github.event_name == 'workflow_dispatch' && inputs.configuration || 'starter-app-demo' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Cache verified public XcodeGen archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/xcodegen
          key: xcodegen-v1-${{ runner.os }}-${{ runner.arch }}-2.46.0-${{ hashFiles('scripts/generate-project.sh', 'scripts/tool_download.py') }}
      - name: Verify native signing export without credentials
        run: |
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          case "$IOS_CONFIGURATION" in
            starter) export IOS_PROJECT_SPEC="$PWD/project.yml" ;;
            pocket-notes) export IOS_PROJECT_SPEC="$PWD/examples/pocket-notes.yml" ;;
            starter-app-demo) export IOS_PROJECT_SPEC="$PWD/examples/starter-app-demo.yml" ;;
            *) echo 'Unsupported manifest choice'; exit 2 ;;
          esac
          bash scripts/generate-project.sh
          python3 scripts/check-configuration.py --output "$RUNNER_TEMP/signing-preflight/configuration.json"
          python3 scripts/check-signing-config.py "$RUNNER_TEMP/signing-preflight/configuration.json"
          IOS_SIGNING_CONFIGURATION_EXPORT="$RUNNER_TEMP/signing-preflight/configuration.json" python3 -m unittest discover -s scripts/tests -p 'test_signing.py' -v
          python3 scripts/write-export-options.py "$RUNNER_TEMP/signing-preflight/configuration.json" "$RUNNER_TEMP/signing-preflight/ExportOptions.plist"
          IOS_SIGNING_TEAM="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))[0]["teamIdentifier"])' "$RUNNER_TEMP/signing-preflight/configuration.json")"
          xcodebuild archive \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/signing-preflight/StarterApp.xcarchive" \
            -quiet \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            "DEVELOPMENT_TEAM=$IOS_SIGNING_TEAM"
          python3 - "$RUNNER_TEMP/signing-preflight/StarterApp.xcarchive" "$RUNNER_TEMP/signing-preflight/configuration.json" <<'PY'
          import json, plistlib, sys
          from pathlib import Path
          archive, config = Path(sys.argv[1]), json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))[-1]
          info_path = archive / 'Products/Applications/StarterApp.app/Info.plist'
          if not info_path.is_file(): raise SystemExit('Unsigned archive is missing StarterApp.app/Info.plist.')
          info = plistlib.loads(info_path.read_bytes())
          for key, expected in (('CFBundleIdentifier', config['bundleIdentifier']),
                                ('CFBundleDisplayName', config['displayName']),
                                ('MinimumOSVersion', config['minimumIOS'])):
              if info.get(key) != expected: raise SystemExit('Unsigned archive metadata does not match the selected configuration.')
          PY
          rm -rf "$RUNNER_TEMP/signing-preflight/StarterApp.xcarchive"
          printf '## Signing preflight passed\n\nFresh native export, validator fixtures, App Store export options, and an unsigned archive passed. No credentials, authenticated reads or Apple signing were used.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-preflight
          path: ${{ runner.temp }}/signing-preflight/configuration.json
          retention-days: 7
  archive:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.perform_signing && github.ref == 'refs/heads/main'
    environment: apple-credentials
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      IOS_CONFIGURATION: ${{ inputs.configuration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Initialize runner report directory
        run: echo "IOS_TEST_OUTPUT_DIR=$RUNNER_TEMP/ios-signing" >> "$GITHUB_ENV"

      - name: Select and verify Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Select manifest
        id: spec
        run: |
          case "$IOS_CONFIGURATION" in
            starter) echo 'path=project.yml' >> "$GITHUB_OUTPUT" ;;
            pocket-notes) echo 'path=examples/pocket-notes.yml' >> "$GITHUB_OUTPUT" ;;
            starter-app-demo) echo 'path=examples/starter-app-demo.yml' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Generate project from selected manifest
        env:
          IOS_PROJECT_SPEC: ${{ steps.spec.outputs.path }}
        run: bash scripts/generate-project.sh

      - name: Export current app configuration
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check signing configuration
        id: app
        run: python3 scripts/check-signing-config.py "$IOS_TEST_OUTPUT_DIR/configuration.json" --output "$GITHUB_OUTPUT"

      - name: Check key type
        env:
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test "$ASC_KEY_TYPE" = team
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"

      - name: Materialize private key without logging it
        id: key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 scripts/materialize-asc-key.py

      - name: Restore verified public CLI downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tool-downloads/asc
          key: asc-v1-${{ runner.os }}-${{ runner.arch }}-5.14.0-${{ hashFiles('scripts/install-asc.py', 'scripts/tool_download.py') }}

      - name: Install pinned App Store Connect CLI
        run: python3 scripts/install-asc.py

      - name: Read Apple account state for selected app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: python3 scripts/apple-doctor.py --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --account --asc build/tools/asc --output-dir "$IOS_TEST_OUTPUT_DIR/apple-diagnostics"

      - name: Require verified existing app identity before signing
        run: |
          python3 - "$IOS_TEST_OUTPUT_DIR/apple-diagnostics/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          findings = {item['check']: item['status'] for item in report['findings']}
          if report['accountSummary']['status'] != 'completed' or findings.get('app_record') != 'present' or findings.get('bundle_id') != 'present':
              raise SystemExit('Apple identity checks are incomplete; signing was not started.')
          PY

      - name: Archive without account-side signing changes
        env:
          IOS_SIGNING_TEAM: ${{ steps.app.outputs.teamIdentifier }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StarterApp.xcarchive" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            "DEVELOPMENT_TEAM=$IOS_SIGNING_TEAM" \
            | xcbeautify

      - name: Prepare App Store export options
        run: |
          python3 scripts/write-export-options.py "$IOS_TEST_OUTPUT_DIR/configuration.json" "$IOS_TEST_OUTPUT_DIR/ExportOptions.plist"

      - name: Export App Store Connect distribution package
        id: distribution
        env:
          ASC_PRIVATE_KEY_PATH: ${{ steps.key.outputs.key_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          EXPORT_DIR="$RUNNER_TEMP/ios-signing/export"
          PACKAGE_DIR="$RUNNER_TEMP/ios-signing/distribution-package"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/StarterApp.xcarchive" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$IOS_TEST_OUTPUT_DIR/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_PRIVATE_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            | xcbeautify
          IPA_COUNT="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          test "$IPA_COUNT" = 1
          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          mkdir -p "$PACKAGE_DIR"
          ditto -x -k "$IPA_PATH" "$PACKAGE_DIR"
          test -d "$PACKAGE_DIR/Payload/StarterApp.app"
          printf 'app_path=%s\n' "$PACKAGE_DIR/Payload/StarterApp.app" >> "$GITHUB_OUTPUT"

      - name: Validate archive-derived distribution signature
        run: python3 scripts/validate-signed-archive.py "$RUNNER_TEMP/StarterApp.xcarchive" "$IOS_TEST_OUTPUT_DIR/configuration.json" --distribution-app "${{ steps.distribution.outputs.app_path }}" --output "$IOS_TEST_OUTPUT_DIR/signing-validation.json"

      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-validation-${{ inputs.configuration }}
          path: ${{ runner.temp }}/ios-signing/signing-validation.json
          retention-days: 7
          if-no-files-found: warn

      - name: Remove signing material and archive
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-private-key.p8"
          rm -rf "$RUNNER_TEMP/StarterApp.xcarchive" "$RUNNER_TEMP/ios-signing/export" "$RUNNER_TEMP/ios-signing/distribution-package" "$RUNNER_TEMP/ios-signing/signing-certificates"
