name: Signed archive validation

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: App configuration to sign
        type: choice
        required: true
        options: [starter, pocket-notes, starter-app-demo]

permissions:
  contents: read

jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    environment: apple-credentials
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      IOS_CONFIGURATION: ${{ inputs.configuration }}
      IOS_TEST_OUTPUT_DIR: ${{ runner.temp }}/ios-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select and verify Xcode
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 27.0'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.0'
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Select manifest
        id: spec
        run: |
          case "$IOS_CONFIGURATION" in
            starter) echo 'path=project.yml' >> "$GITHUB_OUTPUT" ;;
            pocket-notes) echo 'path=examples/pocket-notes.yml' >> "$GITHUB_OUTPUT" ;;
            starter-app-demo) echo 'path=examples/starter-app-demo.yml' >> "$GITHUB_OUTPUT" ;;
            *) exit 2 ;;
          esac

      - name: Generate project from selected manifest
        env:
          IOS_PROJECT_SPEC: ${{ steps.spec.outputs.path }}
        run: bash scripts/generate-project.sh

      - name: Export current app configuration
        run: python3 scripts/check-configuration.py --output "$IOS_TEST_OUTPUT_DIR/configuration.json"

      - name: Check signing configuration
        id: app
        run: python3 scripts/check-signing-config.py "$IOS_TEST_OUTPUT_DIR/configuration.json" --output "$GITHUB_OUTPUT"

      - name: Check key type
        env:
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test "$ASC_KEY_TYPE" = team
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"

      - name: Materialize private key without logging it
        id: key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
          GITHUB_OUTPUT: ${{ runner.temp }}/key-output
        run: |
          python3 scripts/materialize-asc-key.py
          cat "$GITHUB_OUTPUT" >> "$GITHUB_ENV"

      - name: Install pinned App Store Connect CLI
        run: python3 scripts/install-asc.py

      - name: Read Apple account state for selected app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_PATH: ${{ runner.temp }}/asc-private-key.p8
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE }}
        run: python3 scripts/apple-doctor.py --configuration "$IOS_TEST_OUTPUT_DIR/configuration.json" --account --asc build/tools/asc --output-dir "$IOS_TEST_OUTPUT_DIR/apple-diagnostics"

      - name: Require verified existing app identity before signing
        run: |
          python3 - "$IOS_TEST_OUTPUT_DIR/apple-diagnostics/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding='utf-8'))
          findings = {item['check']: item['status'] for item in report['findings']}
          if report['accountSummary']['status'] != 'completed' or findings.get('app_record') != 'present' or findings.get('bundle_id') != 'present':
              raise SystemExit('Apple identity checks are incomplete; signing was not started.')
          PY

      - name: Archive with Xcode automatic signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project StarterApp/StarterApp.xcodeproj \
            -scheme StarterApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/StarterApp.xcarchive" \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM='${{ steps.app.outputs.teamIdentifier }}' \
            | xcbeautify

      - name: Validate signed archive
        run: python3 scripts/validate-signed-archive.py "$RUNNER_TEMP/StarterApp.xcarchive" "$IOS_TEST_OUTPUT_DIR/configuration.json" --output "$IOS_TEST_OUTPUT_DIR/signing-validation.json"

      - name: Upload sanitized validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signing-validation-${{ inputs.configuration }}
          path: ${{ runner.temp }}/ios-signing/signing-validation.json
          retention-days: 7
          if-no-files-found: warn

      - name: Remove signing material and archive
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-private-key.p8" "$RUNNER_TEMP/key-output"
          rm -rf "$RUNNER_TEMP/StarterApp.xcarchive" "$RUNNER_TEMP/signing-certificates"
